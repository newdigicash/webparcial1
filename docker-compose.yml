services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pass1234
      MYSQL_DATABASE: pruebadb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/esquema.sql:/docker-entrypoint-initdb.d/esquema.sql

  adminer:
    image: adminer:latest
    ports:
      - "8082:8080"
    depends_on:
      - db

volumes:
  mysql_data:
